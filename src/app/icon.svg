<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SIMBIOCHEM">
  <title>SIMBIOCHEM</title>
  <defs>
    <!-- Clip so the liquid can never escape the flask silhouette. -->
    <clipPath id="flask">
      <path d="M25.5 10h13a1.6 1.6 0 0 1 0 3.2H37v13.1l13.4 23.2a5.6 5.6 0 0 1-4.9 8.4H18.5a5.6 5.6 0 0 1-4.9-8.4L27 26.3V13.2h-1.5a1.6 1.6 0 0 1 0-3.2z" />
    </clipPath>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5A0" />
      <stop offset="1" stop-color="#76B900" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#001965" />

  <!-- Flask silhouette -->
  <path
    d="M25.5 10h13a1.6 1.6 0 0 1 0 3.2H37v13.1l13.4 23.2a5.6 5.6 0 0 1-4.9 8.4H18.5a5.6 5.6 0 0 1-4.9-8.4L27 26.3V13.2h-1.5a1.6 1.6 0 0 1 0-3.2z"
    fill="#ffffff"
  />

  <!-- Liquid, clipped to the flask -->
  <g clip-path="url(#flask)">
    <rect x="0" y="39" width="64" height="25" fill="url(#liquid)" />
  </g>

  <!-- Bubbles rising out of the neck, echoing the logo's green smoke -->
  <circle cx="32" cy="45" r="2.6" fill="#ffffff" opacity="0.55" />
  <circle cx="25" cy="50" r="1.7" fill="#ffffff" opacity="0.4" />
  <circle cx="39" cy="50.5" r="1.4" fill="#ffffff" opacity="0.35" />
</svg>
